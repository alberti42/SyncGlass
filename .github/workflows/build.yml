name: Build

# Runs the unit tests and builds the universal app, signed ad hoc, on every push
# to main and every pull request. Catches test failures and compile errors with
# the runner's Xcode before a release tag is pushed. Needs no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Test the changelog script
        run: python3 -m unittest discover -s Tests/Scripts -p '*_test.py'

      - name: Build universal app
        run: bin/build-app.sh

      - name: Check the bundle
        run: |
          APP=build/SyncGlass.app
          test -x "$APP/Contents/MacOS/SyncGlass"
          test -x "$APP/Contents/Library/LoginItems/SyncGlassLoginHelper.app/Contents/MacOS/SyncGlassLoginHelper"
          lipo -archs "$APP/Contents/MacOS/SyncGlass" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/SyncGlass" | grep -q x86_64
